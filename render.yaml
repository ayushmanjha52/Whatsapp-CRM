# Render Blueprint for WhatsApp CRM — FREE tier (no card) — https://render.com/docs/blueprint-spec
#
# One free web service runs everything (frontend, API, Socket.IO, Meta/Stripe webhooks,
# and all queue workers) via services/all-in-one, plus a free Key Value (Redis) instance.
# Migrations run automatically at startup when DATABASE_URL is set.
#
# Deploy: https://render.com/deploy?repo=https://github.com/ayushmanjha52/Whatsapp-CRM
# Render asks once for each `sync: false` value. Stripe/Anthropic keys are optional.
# MIGRATE_BASELINE: 0016 if your Supabase DB already ran the original app; empty for a new DB.
#
# Free-tier trade-offs: the service sleeps after ~15 min without traffic (the next request or
# Meta webhook wakes it in about a minute; Meta retries), and Key Value is 25 MB with no
# persistence. For production, use render.scale.yaml (paid, separate workers).

services:
  - type: web
    name: whatsapp-crm
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./WhatsAPP_crm-main/Dockerfile
    dockerContext: ./WhatsAPP_crm-main
    dockerCommand: bun run services/all-in-one/index.ts
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - WhatsAPP_crm-main/BACKEND/**
        - WhatsAPP_crm-main/frontend/**
        - WhatsAPP_crm-main/Dockerfile
      ignoredPaths:
        - WhatsAPP_crm-main/BACKEND/test/**
        - WhatsAPP_crm-main/**/*.md
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: whatsapp-crm-redis
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
      - key: JOB_HISTORY_LIMIT
        value: "100"
      - key: WORKER_CONCURRENCY_OUTBOUND
        value: "5"
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: MIGRATE_BASELINE
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: keyvalue
    name: whatsapp-crm-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []
