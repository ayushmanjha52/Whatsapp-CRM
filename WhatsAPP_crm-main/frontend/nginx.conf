# Serves the SPA and proxies the API on the same origin, so SameSite=Strict
# session cookies and Socket.IO work without CORS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 100m;

  location /api/ {
    proxy_pass http://api-gateway:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/whatsapp/ {
    proxy_pass http://api-gateway:4000;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass http://api-gateway:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /webhooks/whatsapp {
    proxy_pass http://whatsapp-webhook:4001;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
